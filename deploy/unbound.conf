# Recursive resolver for ctprobe alone. It listens on localhost only and
# leaves the system's own resolver alone. Run by ctprobe-unbound.service.
server:
    interface: 127.0.0.1@5335
    access-control: 127.0.0.0/8 allow
    do-daemonize: no
    username: ""
    chroot: ""
    pidfile: ""
    use-syslog: no
    logfile: ""
    verbosity: 1
    num-threads: 2
    do-ip6: yes
    # Plain recursion: answers are measured as the authoritative servers give them.
    module-config: "iterator"
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
    # A name probed again must reach its authoritative servers, not a cached
    # NXDOMAIN, or the time it took to appear reads too late.
    cache-max-negative-ttl: 30
    msg-cache-size: 256m
    rrset-cache-size: 512m
    outgoing-range: 8192
    num-queries-per-thread: 4096
    # Queries per second to any one zone, to stay polite to busy DNS hosts.
    ratelimit: 1000

remote-control:
    control-enable: no
