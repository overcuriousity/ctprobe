bind = "0.0.0.0:8080"
data_dir = "./data"
disk_budget = "4GiB"
tracker_max = "2GiB"
# Substring matches against log names; empty include means all logs.
include_logs = []
exclude_logs = []
log_list_url = "https://www.gstatic.com/ct/log_list/v3/log_list.json"
# Further lists; a log on any list is followed. A list that cannot be read is skipped.
extra_log_lists = ["https://valid.apple.com/ct/log_list/current_log_list.json"]
# Test and staging logs. They then count in every figure.
include_test_logs = false
# Percent of certificates the coverage assessment aims for.
coverage_target = 95

# DNS probing of every certificate name, through a recursive resolver of our own.
[dns]
resolver = "127.0.0.1:5335"
# Queries per second to the resolver; each probe sends two.
max_qps = 2000
# Percent of names probed, chosen by a hash of the name.
sample_pct = 100
# Memory for the last answer per name, used to detect changes.
state_max = "2GiB"
