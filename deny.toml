[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every ignore needs a written reachability argument next to it.
ignore = [
  # Unmaintained, not vulnerable: chrono, chrono-tz and humantime have no
  # maintainer since 2026-11 (chronotope/chrono#1768) and no fixed release.
  # arrow, datafusion and object_store depend on them, so they cannot be
  # replaced here until those move to jiff. Remove once they drop chrono.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; required by arrow and datafusion" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; required by arrow-array" },
  { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained; required by object_store" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "OFL-1.1",
  "CDLA-Permissive-2.0",
  # Not on the manifest list, both permissive: xxhash-rust and the bzip2 codec behind Parquet.
  "BSL-1.0",
  "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
