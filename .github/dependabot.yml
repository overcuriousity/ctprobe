version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # These release together and must stay on matching versions.
      data:
        patterns:
          - arrow*
          - parquet
          - datafusion*
          - sqlparser
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
