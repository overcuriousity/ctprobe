<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · ctprobe</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/uplot.min.css">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/theme.js"></script>
</head>
<body data-page="{{page}}">
<header class="top">

    <a href="/" data-nav="live">Live</a>
    <a href="/sizing" data-nav="sizing">Sizing</a>

  </div>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<main>
{{body}}
</main>
<script src="/assets/i18n.js"></script>
<script src="/assets/uplot.min.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/{{page}}.js"></script>
</body>
</html>
